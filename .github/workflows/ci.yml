name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @biomejs/biome@2.5.14 lint --error-on-warnings .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mod API is early access: keep the version the mod was last checked with.
      - run: npm install -g @anthropic-ai/claude-code@2.1.296 typescript@5.8.3
      # The same static analysis Claude Code runs when it loads the mod.
      - run: claude plugin validate --strict .
      - name: Generate mod API types
        run: claude --init-only --plugin-dir .
        env:
          # Emit API declarations even in a non-interactive session.
          CLAUDE_CODE_PLUGIN_DIR_WATCH: "1"
      - run: tsc -p .
      - run: claude plugin test .
